# Pages CMS configuration for Triple9 Design
media:
  input: public
  output: /triple9-design
content:
  - name: home
    label: Homepage
    path: src/content
    type: file
    filename: home.json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: headline, label: Headline (HTML allowed), type: text }
      - { name: sub, label: Subheading, type: text }
      - { name: primaryCtaLabel, label: Primary button label, type: string }
      - { name: secondaryCtaLabel, label: Secondary button label, type: string }
      - { name: servicesEyebrow, label: Services eyebrow, type: string }
      - { name: servicesHeading, label: Services heading, type: string }
      - name: services
        label: Service cards
        type: list
        fields:
          - { name: name, label: Name, type: string }
          - { name: text, label: One-line description, type: text }
      - { name: whyEyebrow, label: Why eyebrow, type: string }
      - { name: whyHeading, label: Why heading, type: string }
      - name: why
        label: Why points
        type: list
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
  - name: services
    label: Services page
    path: src/content
    type: file
    filename: services.json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: headline, label: Headline (HTML allowed), type: text }
      - { name: sub, label: Subheading, type: text }
      - name: items
        label: Services
        type: list
        fields:
          - { name: name, label: Name, type: string }
          - { name: description, label: Description, type: text }
          - { name: bullets, label: Bullet points (one per line), type: text }
  - name: about
    label: About page
    path: src/content
    type: file
    filename: about.json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: headline, label: Headline (HTML allowed), type: text }
      - { name: body, label: Body, type: text }
      - name: values
        label: Values
        type: list
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
  - name: contact
    label: Contact page
    path: src/content
    type: file
    filename: contact.json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: headline, label: Headline (HTML allowed), type: text }
      - { name: sub, label: Subheading, type: text }
      - { name: phone, label: Phone display, type: string }
      - { name: phoneHref, label: Phone link (tel:), type: string }
      - { name: email, label: Email, type: string }
      - { name: services, label: Service checkboxes (one per line), type: text }
      - { name: successHeading, label: Success heading, type: string }
      - { name: successText, label: Success text, type: text }
