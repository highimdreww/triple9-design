media:
  input: public
  output: /triple9-design

content:
  - name: home
    label: Homepage
    type: file
    path: src/content/home.json
    fields:
      - { name: headline, label: Hero headline (HTML), type: text }
      - { name: primaryCtaLabel, label: Quote button, type: string }
      - { name: manifesto, label: Work introduction, type: text }
      - { name: sub, label: Hero introduction, type: text }
      - { name: servicesHeading, label: Services heading, type: string }
      - name: projects
        label: Portfolio (lead project first)
        type: object
        list: true
        fields:
          - { name: name, label: Project name, type: string }
          - { name: caption, label: Project status, type: string }
          - { name: image, label: Screenshot filename, type: string }
          - { name: alt, label: Screenshot description, type: text }
          - { name: url, label: Website or demo path, type: string }
      - name: app
        label: App showcase
        type: object
        fields:
          - { name: heading, type: string }
          - { name: description, type: text }
          - { name: name, label: App name, type: string }
          - { name: tagline, type: string }
          - name: features
            type: object
            list: true
            fields:
              - { name: title, type: string }
              - { name: text, type: text }
      - { name: whyHeading, label: Approach heading, type: string }
      - name: why
        label: Approach
        type: object
        list: true
        fields:
          - { name: title, type: string }
          - { name: text, type: text }

  - name: services
    label: Services
    type: file
    path: src/content/services.json
    fields:
      - { name: headline, label: Headline (HTML), type: text }
      - { name: sub, label: Introduction, type: text }
      - name: items
        label: Services on Home and Services
        type: object
        list: true
        fields:
          - { name: id, label: Link anchor, type: string, required: true }
          - { name: name, label: Service name, type: string }
          - { name: description, type: text }
          - { name: bullets, label: Included work, type: string, list: true }

  - name: about
    label: About
    type: file
    path: src/content/about.json
    fields:
      - { name: headline, label: Headline (HTML), type: text }
      - { name: body, type: text }
      - name: values
        type: object
        list: true
        fields:
          - { name: title, type: string }
          - { name: text, type: text }

  - name: contact
    label: Contact
    type: file
    path: src/content/contact.json
    fields:
      - { name: eyebrow, type: string, hidden: true }
      - { name: headline, label: Headline (HTML), type: text }
      - { name: sub, label: Introduction, type: text }
      - { name: phone, type: string }
      - { name: phoneHref, label: Phone link, type: string }
      - { name: email, type: string }
      - { name: services, label: Service checkboxes, type: string, list: true }
      - { name: successHeading, label: Success heading, type: string }
      - { name: successText, label: Success text, type: text }
      - { name: quoteFormEndpoint, label: Quote form endpoint, type: string }
