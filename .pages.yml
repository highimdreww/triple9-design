media:
  input: public/images
  output: /images

content:
  - name: homepage
    label: Homepage
    type: file
    path: src/content/home.json
    fields:
      - name: eyebrow
        label: Hero Eyebrow
        type: string

      - name: headline
        label: Hero Headline
        type: string

      - name: description
        label: Hero Description
        type: text

      - name: workHeading
        label: Work Heading
        type: string

      - name: servicesHeading
        label: Services Heading
        type: string

      - name: processHeading
        label: Process Heading
        type: string

      - name: pricingHeading
        label: Pricing Heading
        type: string

      - name: aboutHeading
        label: About Heading
        type: string

      - name: aboutBody
        label: About Description
        type: text

      - name: contactHeading
        label: Contact Heading
        type: string

  - name: services
    label: Services
    type: file
    path: src/content/services.json
    fields:
      - name: services
        label: Service List
        type: object
        list: true
        fields:
          - name: title
            label: Service Name
            type: string

          - name: description
            label: Description
            type: text

  - name: pricing
    label: Pricing
    type: file
    path: src/content/pricing.json
    fields:
      - name: tiers
        label: Pricing Tiers
        type: object
        list: true
        fields:
          - name: name
            label: Tier Name
            type: string

          - name: price
            label: Price
            type: number

          - name: description
            label: Short Description
            type: text

          - name: featured
            label: Featured Plan
            type: boolean

          - name: features
            label: Included Features
            type: string
            list: true

  - name: contact
    label: Contact Information
    type: file
    path: src/content/contact.json
    fields:
      - name: phone
        label: Phone Number
        type: string

      - name: phoneHref
        label: Phone Link
        type: string

      - name: email
        label: Email Address
        type: string

      - name: location
        label: Location
        type: string

      - name: hours
        label: Availability Note
        type: string
